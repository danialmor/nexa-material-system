<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NEXA</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:var(--tg-theme-bg-color,#ffffff);
  --bg2:var(--tg-theme-secondary-bg-color,#f1f3f5);
  --tx:var(--tg-theme-text-color,#14181f);
  --hint:var(--tg-theme-hint-color,#6b7280);
  --btn:var(--tg-theme-button-color,#2a6df4);
  --btnx:var(--tg-theme-button-text-color,#ffffff);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg2);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:480px;margin:0 auto;padding:16px}
h1{font-size:24px;line-height:1.25;margin:8px 0 4px}
h2{font-size:15px;margin:0 0 10px;color:var(--hint);font-weight:600}
section{background:var(--bg);border-radius:14px;padding:16px;margin-top:12px}
.badge{display:inline-block;padding:2px 12px;border-radius:99px;background:var(--btn);color:var(--btnx);font-size:14px}
.wait{border-inline-start:4px solid var(--btn)}
.wait b{display:block;margin-bottom:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--bg2);border-radius:8px;padding:4px 10px;font-size:13px}
.hint{color:var(--hint);font-size:14px}
button{font:inherit;cursor:pointer;border:0}
.main-btn{width:100%;padding:12px;border-radius:12px;background:var(--btn);color:var(--btnx);font-weight:600;margin-top:10px}
.langs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lang{padding:12px;border-radius:12px;background:var(--bg);color:var(--tx);border:2px solid transparent}
section .lang{background:var(--bg2)}
.lang[aria-pressed="true"]{border-color:var(--btn);font-weight:600}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--btn);outline-offset:2px}
select,input:not([type=checkbox]){width:100%;padding:10px;border-radius:10px;border:0;background:var(--bg2);color:var(--tx);font:inherit;margin-top:6px}
.f{display:block;margin-top:8px;font-size:13px;color:var(--hint)}
.chk{display:flex;gap:8px;align-items:center;padding:6px 0}
.chk input{width:20px;height:20px}
.center{text-align:center;padding:48px 16px}
#toast{position:fixed;inset-inline:16px;bottom:calc(16px + env(safe-area-inset-bottom));max-width:448px;margin:auto;background:var(--tx);color:var(--bg);padding:10px 14px;border-radius:12px;text-align:center}
[hidden]{display:none!important}
</style>
</head>
<body>
<main id="app"><div class="center hint">…</div></main>
<div id="toast" hidden role="status"></div>
<script>
const API = 'https://script.google.com/macros/s/AKfycbxGnVlg7IzVDfZNrJZQmUZ3vfmPAYCDXwyEHcFE2xdWnSCk84OpthratcIFsZG2CstU/exec';
const SITE = 'https://sites.google.com/view/msproject-sarzamin';
const NAMES = {en:'English', fa:'فارسی', ar:'العربية', tr:'Türkçe', ru:'Русский'};
const T = {
  en:{hi:'Hello',role:'Role',lang:'Language',access:'Your access',none:'No access yet',wt:'Waiting for approval',wp:'Your account is registered. An administrator will assign your role soon.',site:'Open project site',err:'Could not load',retry:'Try again',tg:'Open this page from the Telegram bot.'},
  fa:{hi:'سلام',role:'نقش',lang:'زبان',access:'دسترسی‌های شما',none:'هنوز دسترسی ندارید',wt:'در انتظار تأیید',wp:'ثبت‌نام شما انجام شد. ادمین به‌زودی نقش شما را تعیین می‌کند.',site:'باز کردن سایت پروژه',err:'بارگذاری نشد',retry:'تلاش دوباره',tg:'این صفحه را از داخل ربات تلگرام باز کنید.'},
  ar:{hi:'مرحبًا',role:'الدور',lang:'اللغة',access:'صلاحياتك',none:'لا توجد صلاحيات بعد',wt:'بانتظار الموافقة',wp:'تم تسجيلك. سيحدد المسؤول دورك قريبًا.',site:'فتح موقع المشروع',err:'تعذر التحميل',retry:'حاول مرة أخرى',tg:'افتح هذه الصفحة من بوت تيليجرام.'},
  tr:{hi:'Merhaba',role:'Rol',lang:'Dil',access:'Yetkileriniz',none:'Henüz yetki yok',wt:'Onay bekleniyor',wp:'Kaydınız alındı. Yönetici yakında rolünüzü belirleyecek.',site:'Proje sitesini aç',err:'Yüklenemedi',retry:'Tekrar dene',tg:'Bu sayfayı Telegram botundan açın.'},
  ru:{hi:'Здравствуйте',role:'Роль',lang:'Язык',access:'Ваши права',none:'Прав пока нет',wt:'Ожидает одобрения',wp:'Вы зарегистрированы. Администратор скоро назначит вам роль.',site:'Открыть сайт проекта',err:'Не удалось загрузить',retry:'Повторить',tg:'Откройте эту страницу из Telegram-бота.'}
};
// Admin-panel strings: English + Persian (other languages fall back to English)
Object.assign(T.en,{adm:'Admin panel',back:'Back',users:'Users',roles:'Roles',save:'Save',saved:'Saved',perms:'Permissions',st_active:'Active',st_pending:'Pending',st_blocked:'Blocked'});
Object.assign(T.fa,{adm:'پنل مدیریت',back:'بازگشت',users:'کاربران',roles:'نقش‌ها',save:'ذخیره',saved:'ذخیره شد',perms:'دسترسی‌ها',st_active:'فعال',st_pending:'در انتظار',st_blocked:'مسدود'});

const tg = window.Telegram && Telegram.WebApp;
const app = document.getElementById('app');
let lang = 'en', me = null, A = null, tab = 'users';
const t = k => ((T[lang] || {})[k]) || T.en[k] || k;
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const has = p => me.permissions.indexOf(p) > -1;
const rt = r => r.titles[lang] || r.titles.en || r.key;

function toast(m){
  const x = document.getElementById('toast');
  x.textContent = m; x.hidden = false;
  clearTimeout(toast.h); toast.h = setTimeout(() => x.hidden = true, 1800);
}
function setLang(l){
  lang = T[l] ? l : 'en';
  document.documentElement.lang = lang;
  document.documentElement.dir = (lang === 'fa' || lang === 'ar') ? 'rtl' : 'ltr';
}
async function call(action, extra){
  const r = await fetch(API, {method:'POST', body: JSON.stringify(Object.assign({action, initData: tg.initData}, extra))});
  const j = await r.json();
  if(!j.ok) throw new Error(j.error);
  return j.data;
}

/* ---------- Main view ---------- */
function view(){
  const u = me.user, role = me.role_titles[lang] || me.role_titles.en || u.role;
  const name = [u.first_name, u.last_name].filter(Boolean).join(' ') || u.username || '';
  const pending = u.role === 'pending' || u.status === 'pending';
  app.innerHTML =
    '<h1>' + esc(t('hi')) + ' ' + esc(name) + '</h1>' +
    '<p class="hint">' + esc(t('role')) + ': <span class="badge">' + esc(role) + '</span></p>' +
    (pending ? '<section class="wait"><b>' + esc(t('wt')) + '</b>' + esc(t('wp')) + '</section>' : '') +
    '<section><h2>' + esc(t('access')) + '</h2>' +
      (me.permissions.length
        ? '<div class="chips">' + me.permissions.map(p => '<span class="chip">' + esc(p) + '</span>').join('') + '</div>'
        : '<span class="hint">' + esc(t('none')) + '</span>') + '</section>' +
    (has('view_dashboard') ? '<section><button class="main-btn" id="site" style="margin:0">' + esc(t('site')) + '</button></section>' : '') +
    ((has('manage_users') || has('manage_roles')) ? '<section><button class="main-btn" id="adm" style="margin:0">' + esc(t('adm')) + '</button></section>' : '') +
    '<section><h2>' + esc(t('lang')) + '</h2><div class="langs">' +
      Object.keys(NAMES).map(l => '<button class="lang" data-l="' + l + '" aria-pressed="' + (l === lang) + '">' + NAMES[l] + '</button>').join('') +
    '</div></section>';
  const site = document.getElementById('site');
  if(site) site.onclick = () => tg.openLink(SITE);
  const adm = document.getElementById('adm');
  if(adm) adm.onclick = openAdmin;
  app.querySelectorAll('.lang').forEach(b => b.onclick = async () => {
    const l = b.dataset.l;
    setLang(l); view();
    try { await call('setLang', {lang: l}); } catch(e) { fail(e); }
  });
}

/* ---------- Admin panel ---------- */
async function openAdmin(){
  try { A = await call('admin.list'); tab = A.can.users ? 'users' : 'roles'; adminView(); }
  catch(e){ toast(e.message); }
}
async function reloadAdmin(){
  try { A = await call('admin.list'); adminView(); } catch(e){ toast(e.message); }
}
function usersHtml(){
  return A.users.map(u => {
    const self = String(u.id) === String(me.user.id), dis = self ? ' disabled' : '';
    return '<section><b>' + esc(u.name || u.username || u.id) + '</b>' +
      '<div class="hint">' + (u.username ? '@' + esc(u.username) + ' · ' : '') + esc(u.id) + '</div>' +
      '<select data-u="' + esc(u.id) + '" data-f="role"' + dis + '>' +
        A.roles.map(r => '<option value="' + esc(r.key) + '"' + (r.key === u.role ? ' selected' : '') + '>' + esc(rt(r)) + '</option>').join('') +
      '</select>' +
      '<select data-u="' + esc(u.id) + '" data-f="status"' + dis + '>' +
        ['active','pending','blocked'].map(s => '<option value="' + s + '"' + (s === u.status ? ' selected' : '') + '>' + esc(t('st_' + s)) + '</option>').join('') +
      '</select></section>';
  }).join('');
}
function rolesHtml(){
  return A.roles.map(r =>
    '<section data-r="' + esc(r.key) + '"><b>' + esc(rt(r)) + '</b> <span class="hint">' + esc(r.key) + '</span>' +
    Object.keys(NAMES).map(l => '<label class="f">' + NAMES[l] +
      '<input data-t="' + l + '" value="' + esc(r.titles[l] || '') + '" dir="auto" maxlength="60"></label>').join('') +
    '<button class="main-btn" data-save="' + esc(r.key) + '">' + esc(t('save')) + '</button>' +
    '<h2 style="margin-top:16px">' + esc(t('perms')) + '</h2>' +
    A.all_perms.map(p => '<label class="chk"><input type="checkbox" data-p="' + esc(p) + '"' +
      (r.perms.indexOf(p) > -1 ? ' checked' : '') + (r.key === 'admin' ? ' disabled' : '') + '> ' + esc(p) + '</label>').join('') +
    '</section>').join('');
}
function adminView(){
  const tabs = [];
  if(A.can.users) tabs.push(['users', t('users')]);
  if(A.can.roles) tabs.push(['roles', t('roles')]);
  app.innerHTML =
    '<p><button class="lang" id="back">← ' + esc(t('back')) + '</button></p>' +
    '<h1>' + esc(t('adm')) + '</h1>' +
    '<div class="langs">' + tabs.map(x => '<button class="lang" data-tab="' + x[0] + '" aria-pressed="' + (tab === x[0]) + '">' + esc(x[1]) + '</button>').join('') + '</div>' +
    (tab === 'users' ? usersHtml() : rolesHtml());
}

app.addEventListener('click', async e => {
  const b = e.target.closest('button');
  if(!b || !A || !document.getElementById('back')) return;
  if(b.id === 'back'){ load(); }
  else if(b.dataset.tab){ tab = b.dataset.tab; adminView(); }
  else if(b.dataset.save){
    const sec = b.closest('section'), titles = {};
    sec.querySelectorAll('input[data-t]').forEach(i => titles[i.dataset.t] = i.value.trim());
    try { await call('admin.setTitles', {role: b.dataset.save, titles}); toast(t('saved')); await reloadAdmin(); }
    catch(err){ toast(err.message); }
  }
});
app.addEventListener('change', async e => {
  const el = e.target;
  try {
    if(el.dataset.u){
      const id = el.dataset.u;
      const sel = f => app.querySelector('select[data-u="' + id + '"][data-f="' + f + '"]');
      let role = sel('role').value, status = sel('status').value;
      if(el.dataset.f === 'role' && status !== 'blocked') status = role === 'pending' ? 'pending' : 'active';
      await call('admin.setUser', {id, role, status});
      toast(t('saved')); await reloadAdmin();
    } else if(el.dataset.p){
      const role = el.closest('section').dataset.r;
      await call('admin.setPerm', {role, perm: el.dataset.p, value: el.checked});
      toast(t('saved'));
    }
  } catch(err){
    toast(err.message);
    if(el.dataset.p) el.checked = !el.checked; else reloadAdmin();
  }
});

function fail(e){
  const msg = (e && e.message === 'no_init_data') ? t('tg') : t('err') + ' (' + esc(e && e.message) + ')';
  app.innerHTML = '<div class="center"><p>' + msg + '</p><button class="main-btn" id="retry">' + esc(t('retry')) + '</button></div>';
  document.getElementById('retry').onclick = load;
}
async function load(){
  try {
    if(!tg || !tg.initData) throw new Error('no_init_data');
    A = null;
    me = await call('me');
    setLang(me.user.lang);
    view();
  } catch(e) { fail(e); }
}

if(tg){ tg.ready(); tg.expand(); }
load();
</script>
</body>
</html>
