<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>درخواست مصالح</title>

  <!-- Telegram Mini App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    /* =========================
       RESET
    ========================= */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* =========================
       COLORS
    ========================= */

    :root {
      --cream: #f7f1e3;
      --cream-light: #fffaf0;
      --gold: #b89145;
      --gold-light: #d7b56d;
      --gold-dark: #8e6c2f;
      --brown: #3d3428;
      --brown-light: #756a5b;
      --white: #ffffff;
      --border: #e6d9bd;
      --success: #58745a;
      --danger: #a95345;
      --shadow: 0 10px 35px rgba(70, 55, 30, 0.10);
    }

    /* =========================
       BODY
    ========================= */

    body {
      min-height: 100vh;
      background:
        radial-gradient(
          circle at top right,
          #fffaf0 0%,
          var(--cream) 45%,
          #eee3cd 100%
        );

      color: var(--brown);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;

      padding: 18px;
    }

    /* =========================
       APP
    ========================= */

    .app {
      width: 100%;
      max-width: 520px;
      margin: auto;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
      text-align: center;
      padding: 12px 0 22px;
    }

    .logo {
      width: 62px;
      height: 62px;

      margin: 0 auto 14px;

      border-radius: 20px;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        linear-gradient(
          145deg,
          var(--gold-light),
          var(--gold)
        );

      color: white;

      font-size: 29px;

      box-shadow:
        0 8px 22px rgba(142,108,47,.25);
    }

    .header h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.4px;
    }

    .header p {
      margin-top: 7px;
      color: var(--brown-light);
      font-size: 13px;
    }

    /* =========================
       CARD
    ========================= */

    .card {
      background: rgba(255,255,255,.88);

      border: 1px solid rgba(184,145,69,.18);

      border-radius: 24px;

      padding: 20px;

      box-shadow: var(--shadow);

      backdrop-filter: blur(10px);
    }

    /* =========================
       USER
    ========================= */

    .user-card {
      display: flex;
      align-items: center;
      gap: 12px;

      padding: 13px;

      margin-bottom: 20px;

      background: var(--cream-light);

      border: 1px solid var(--border);

      border-radius: 15px;
    }

    .avatar {
      width: 43px;
      height: 43px;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      background: var(--gold);

      color: white;

      font-size: 18px;
      font-weight: bold;

      flex-shrink: 0;
    }

    .user-info {
      min-width: 0;
    }

    .user-name {
      font-size: 15px;
      font-weight: 700;
    }

    .user-role {
      margin-top: 3px;

      color: var(--brown-light);

      font-size: 12px;
    }

    /* =========================
       SECTION TITLE
    ========================= */

    .section-title {
      display: flex;
      align-items: center;

      gap: 9px;

      margin-bottom: 15px;

      font-size: 17px;
      font-weight: 800;
    }

    .section-icon {
      width: 30px;
      height: 30px;

      border-radius: 9px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #f1e4c8;

      color: var(--gold-dark);
    }

    /* =========================
       FORM
    ========================= */

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;

      margin-bottom: 7px;

      font-size: 13px;
      font-weight: 700;
    }

    .field input,
    .field textarea,
    .field select {

      width: 100%;

      border: 1px solid var(--border);

      border-radius: 13px;

      background: #fffdf8;

      color: var(--brown);

      padding: 13px 14px;

      outline: none;

      font-size: 14px;

      transition: .2s;
    }

    .field input:focus,
    .field textarea:focus,
    .field select:focus {

      border-color: var(--gold);

      box-shadow:
        0 0 0 3px rgba(184,145,69,.12);
    }

    .field textarea {
      min-height: 90px;
      resize: vertical;
    }

    /* =========================
       TWO COLUMNS
    ========================= */

    .row {
      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 10px;
    }

    /* =========================
       BUTTON
    ========================= */

    .button {

      width: 100%;

      border: none;

      border-radius: 14px;

      padding: 14px;

      margin-top: 7px;

      background:
        linear-gradient(
          135deg,
          var(--gold-light),
          var(--gold)
        );

      color: white;

      font-size: 15px;

      font-weight: 800;

      cursor: pointer;

      box-shadow:
        0 7px 18px rgba(142,108,47,.22);

      transition: transform .15s, opacity .15s;
    }

    .button:active {
      transform: scale(.98);
    }

    .button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    /* =========================
       STATUS
    ========================= */

    .status {

      margin-top: 14px;

      padding: 12px;

      border-radius: 12px;

      font-size: 13px;

      display: none;
    }

    .status.success {

      display: block;

      background: #edf4ed;

      color: var(--success);
    }

    .status.error {

      display: block;

      background: #f8ece9;

      color: var(--danger);
    }

    /* =========================
       LOADING
    ========================= */

    .loading {

      position: fixed;

      inset: 0;

      background: var(--cream);

      display: flex;

      align-items: center;

      justify-content: center;

      z-index: 100;
    }

    .loading-box {
      text-align: center;
    }

    .spinner {

      width: 42px;
      height: 42px;

      border-radius: 50%;

      border: 3px solid #eadfc7;

      border-top-color: var(--gold);

      animation: spin .8s linear infinite;

      margin: auto auto 15px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =========================
       REGISTER
    ========================= */

    #registerSection {
      display: none;
    }

    #requestSection {
      display: none;
    }

    #successSection {
      display: none;
      text-align: center;
    }

    .success-icon {

      width: 65px;
      height: 65px;

      margin: 5px auto 15px;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #edf4ed;

      color: var(--success);

      font-size: 30px;
    }

    .request-code {

      margin-top: 12px;

      padding: 11px;

      border-radius: 10px;

      background: var(--cream);

      color: var(--gold-dark);

      font-weight: 700;

      font-size: 13px;
    }

    /* =========================
       FOOTER
    ========================= */

    .footer {

      text-align: center;

      padding: 18px 0 5px;

      color: var(--brown-light);

      font-size: 11px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 420px) {

      body {
        padding: 12px;
      }

      .card {
        padding: 16px;
        border-radius: 20px;
      }

      .header h1 {
        font-size: 21px;
      }

      .row {
        grid-template-columns: 1fr;
        gap: 0;
      }

    }

  </style>
</head>


<body>


<!-- =========================
     LOADING
========================= -->

<div id="loading" class="loading">

  <div class="loading-box">

    <div class="spinner"></div>

    <div>
      در حال اتصال...
    </div>

  </div>

</div>


<!-- =========================
     APP
========================= -->

<div class="app">


  <!-- HEADER -->

  <div class="header">

    <div class="logo">
      📦
    </div>

    <h1>
      درخواست مصالح
    </h1>

    <p>
      سامانه ثبت و پیگیری درخواست‌های خرید
    </p>

  </div>


  <!-- MAIN CARD -->

  <div class="card">


    <!-- USER -->

    <div class="user-card">

      <div
        id="avatar"
        class="avatar"
      >
        👤
      </div>

      <div class="user-info">

        <div
          id="userName"
          class="user-name"
        >
          در حال شناسایی...
        </div>

        <div
          id="userRole"
          class="user-role"
        >
          در حال بررسی اطلاعات
        </div>

      </div>

    </div>


    <!-- =========================
         REGISTER
    ========================= -->

    <div id="registerSection">

      <div class="section-title">

        <div class="section-icon">
          👤
        </div>

        معرفی کاربر

      </div>


      <div class="field">

        <label>
          سمت / نقش شما
        </label>

        <input
          id="role"
          type="text"
          placeholder="مثلاً سرپرست کارگاه"
        >

      </div>


      <button
        class="button"
        onclick="registerUser()"
      >
        ادامه
      </button>


      <div
        id="registerStatus"
        class="status"
      ></div>

    </div>


    <!-- =========================
         REQUEST
    ========================= -->

    <div id="requestSection">

      <div class="section-title">

        <div class="section-icon">
          📋
        </div>

        ثبت درخواست جدید

      </div>


      <!-- MATERIAL -->

      <div class="field">

        <label>
          نام مصالح
        </label>

        <input
          id="material"
          type="text"
          placeholder="مثلاً سیمان، میلگرد، گچ..."
        >

      </div>


      <!-- QUANTITY / UNIT -->

      <div class="row">

        <div class="field">

          <label>
            مقدار
          </label>

          <input
            id="quantity"
            type="number"
            inputmode="decimal"
            placeholder="مثلاً 100"
          >

        </div>


        <div class="field">

          <label>
            واحد
          </label>

          <input
            id="unit"
            type="text"
            placeholder="کیسه / تن / عدد"
          >

        </div>

      </div>


      <!-- DESCRIPTION -->

      <div class="field">

        <label>
          توضیحات
        </label>

        <textarea
          id="description"
          placeholder="در صورت نیاز توضیحات درخواست را وارد کنید..."
        ></textarea>

      </div>


      <button
        id="submitButton"
        class="button"
        onclick="submitRequest()"
      >
        ثبت درخواست
      </button>


      <div
        id="requestStatus"
        class="status"
      ></div>

    </div>


    <!-- =========================
         SUCCESS
    ========================= -->

    <div id="successSection">

      <div class="success-icon">
        ✓
      </div>

      <h2>
        درخواست ثبت شد
      </h2>

      <p
        style="margin-top:8px;color:#756a5b;font-size:13px;"
      >
        درخواست شما برای بررسی مدیر اجرایی ارسال شد.
      </p>

      <div
        id="requestCode"
        class="request-code"
      ></div>

      <button
        class="button"
        onclick="newRequest()"
      >
        ثبت درخواست جدید
      </button>

    </div>


  </div>


  <div class="footer">
    Material Request System
  </div>


</div>


<script>

/* =====================================================
   TELEGRAM
===================================================== */

const tg = window.Telegram
  ? window.Telegram.WebApp
  : null;


/* =====================================================
   GLOBAL
===================================================== */

let telegramUser = null;
let currentUser = null;


/* =====================================================
   START
===================================================== */

function startApp() {

  /*
   Telegram Mini App
  */

  if (tg) {

    tg.ready();

    tg.expand();

  }


  /*
   دریافت اطلاعات کاربر
  */

  if (
    tg &&
    tg.initDataUnsafe &&
    tg.initDataUnsafe.user
  ) {

    telegramUser =
      tg.initDataUnsafe.user;

  }


  /*
   اگر کاربر Telegram پیدا نشد
  */

  if (!telegramUser) {

    hideLoading();

    document.getElementById(
      "userName"
    ).innerText =
      "کاربر Telegram شناسایی نشد";

    document.getElementById(
      "userRole"
    ).innerText =
      "لطفاً Mini App را از داخل Telegram اجرا کنید.";

    return;

  }


  /*
   نمایش اطلاعات
  */

  const fullName =
    (
      telegramUser.first_name || ""
    ) +
    " " +
    (
      telegramUser.last_name || ""
    );


  document.getElementById(
    "userName"
  ).innerText =
    fullName.trim() || "کاربر";


  /*
   Avatar
  */

  document.getElementById(
    "avatar"
  ).innerText =
    (
      telegramUser.first_name || "👤"
    ).charAt(0);


  /*
   بررسی کاربر در Google Apps Script
  */

  google.script.run

    .withSuccessHandler(
      function(user) {

        hideLoading();

        if (user) {

          currentUser = user;

          document.getElementById(
            "userRole"
          ).innerText =
            "سمت: " +
            (user.role || "-");

          showRequestForm();

        }

        else {

          document.getElementById(
            "userRole"
          ).innerText =
            "لطفاً سمت خود را ثبت کنید.";

          showRegister();

        }

      }
    )

    .withFailureHandler(
      function(error) {

        hideLoading();

        showStatus(
          "requestStatus",
          "خطا در اتصال به سرور: " +
          error.message,
          "error"
        );

      }
    )

    .getUser(
      String(telegramUser.id)
    );

}


/* =====================================================
   LOADING
===================================================== */

function hideLoading() {

  document.getElementById(
    "loading"
  ).style.display = "none";

}


/* =====================================================
   REGISTER
===================================================== */

function showRegister() {

  document.getElementById(
    "registerSection"
  ).style.display = "block";

}


function registerUser() {

  const role =
    document.getElementById(
      "role"
    ).value.trim();


  if (!role) {

    showStatus(
      "registerStatus",
      "لطفاً سمت خود را وارد کنید.",
      "error"
    );

    return;

  }


  google.script.run

    .withSuccessHandler(
      function(user) {

        currentUser = user;

        document.getElementById(
          "userRole"
        ).innerText =
          "سمت: " +
          user.role;


        document.getElementById(
          "registerSection"
        ).style.display =
          "none";


        showRequestForm();

      }
    )

    .withFailureHandler(
      function(error) {

        showStatus(
          "registerStatus",
          error.message,
          "error"
        );

      }
    )

    .saveUser({

      telegram_id:
        String(telegramUser.id),

      name:
        (
          telegramUser.first_name || ""
        ) +
        " " +
        (
          telegramUser.last_name || ""
        ),

      username:
        telegramUser.username || "",

      role:
        role

    });

}


/* =====================================================
   REQUEST FORM
===================================================== */

function showRequestForm() {

  document.getElementById(
    "requestSection"
  ).style.display = "block";

}


/* =====================================================
   SUBMIT REQUEST
===================================================== */

function submitRequest() {

  const material =
    document.getElementById(
      "material"
    ).value.trim();


  const quantity =
    document.getElementById(
      "quantity"
    ).value.trim();


  const unit =
    document.getElementById(
      "unit"
    ).value.trim();


  const description =
    document.getElementById(
      "description"
    ).value.trim();


  if (!material) {

    showStatus(
      "requestStatus",
      "نام مصالح را وارد کنید.",
      "error"
    );

    return;

  }


  const button =
    document.getElementById(
      "submitButton"
    );


  button.disabled = true;

  button.innerText =
    "در حال ثبت...";


  google.script.run

    .withSuccessHandler(
      function(result) {

        document.getElementById(
          "requestSection"
        ).style.display =
          "none";


        document.getElementById(
          "successSection"
        ).style.display =
          "block";


        document.getElementById(
          "requestCode"
        ).innerText =
          "کد درخواست: " +
          result.request_id;


        button.disabled = false;

        button.innerText =
          "ثبت درخواست";

      }
    )

    .withFailureHandler(
      function(error) {

        showStatus(
          "requestStatus",
          error.message,
          "error"
        );


        button.disabled = false;

        button.innerText =
          "ثبت درخواست";

      }
    )

    .saveRequest({

      telegram_id:
        String(telegramUser.id),

      name:
        (
          telegramUser.first_name || ""
        ) +
        " " +
        (
          telegramUser.last_name || ""
        ),

      material:
        material,

      quantity:
        quantity,

      unit:
        unit,

      description:
        description

    });

}


/* =====================================================
   STATUS
===================================================== */

function showStatus(
  elementId,
  message,
  type
) {

  const element =
    document.getElementById(
      elementId
    );


  element.innerText =
    message;


  element.className =
    "status " + type;

}


/* =====================================================
   NEW REQUEST
===================================================== */

function newRequest() {

  document.getElementById(
    "material"
  ).value = "";


  document.getElementById(
    "quantity"
  ).value = "";


  document.getElementById(
    "unit"
  ).value = "";


  document.getElementById(
    "description"
  ).value = "";


  document.getElementById(
    "successSection"
  ).style.display =
    "none";


  document.getElementById(
    "requestSection"
  ).style.display =
    "block";

}


/* =====================================================
   START
===================================================== */

window.addEventListener(
  "load",
  function() {

    setTimeout(
      startApp,
      300
    );

  }
);

</script>

</body>
</html>
