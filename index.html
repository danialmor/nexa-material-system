<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NEXA</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{font-family:Tahoma,Arial,sans-serif}*{box-sizing:border-box}
body{margin:0;background:var(--tg-theme-bg-color,#f4f6f8);color:var(--tg-theme-text-color,#17202a)}
.wrap{max-width:760px;margin:auto;padding:16px 14px 40px}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.brand{font-size:24px;font-weight:800}.muted{opacity:.7;font-size:13px}
.card{background:var(--tg-theme-secondary-bg-color,#fff);border-radius:16px;padding:14px;margin:10px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mod{border:0;background:var(--tg-theme-secondary-bg-color,#fff);color:inherit;border-radius:16px;padding:14px;text-align:right;min-height:110px;cursor:pointer;font:inherit}
.mod b{display:block;margin-top:8px}.mod small{display:block;margin-top:5px;opacity:.65;font-size:11px;line-height:1.6}
label{display:block;font-size:12px;font-weight:700;margin:10px 0 5px}
select,input,textarea,button{width:100%;font:inherit;border-radius:12px;border:1px solid rgba(127,127,127,.25);padding:10px;background:var(--tg-theme-bg-color,#fff);color:inherit}
textarea{min-height:80px}
button.p{border:0;background:var(--tg-theme-button-color,#2481cc);color:var(--tg-theme-button-text-color,#fff);font-weight:700;margin-top:10px}
button.s{background:transparent;margin-top:10px}
button.r{background:#c0392b;border:0;color:#fff;margin-top:8px;font-weight:700}
.ok{padding:10px;border-radius:12px;background:rgba(36,129,204,.12);margin-bottom:8px}
.er{padding:10px;border-radius:12px;background:rgba(220,53,69,.12);color:#a11;margin-bottom:8px}
.li{padding:10px 0;border-bottom:1px solid rgba(127,127,127,.15)}.li:last-child{border:0}
.hidden{display:none}pre{white-space:pre-wrap;font:inherit;margin:6px 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div><div class="brand">NEXA</div><div class="muted">سامانه درون‌سازمانی</div></div>
    <button class="s" style="width:auto;margin:0;padding:8px 12px" onclick="location.reload()">↻</button>
  </div>
  <div id="msg"></div>
  <section id="pending" class="card hidden"><h3>در انتظار تأیید</h3><div id="ptxt"></div></section>
  <section id="dash" class="hidden">
    <div class="card"><b id="uname"></b></div>
    <div id="mods" class="grid"></div>
  </section>
  <section id="screen" class="card hidden"></section>
</div>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbw_D-ysxf2Gn03Jq_rv-Sh5x0UFNwr5iIlNQjw1TliQHNYrvnFnV52SH8NFZXJUsuuV/exec';
const TG=window.Telegram&&Telegram.WebApp;let S=null;
if(TG){TG.ready();TG.expand()}
const $=id=>document.getElementById(id);
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function msg(t,c){const e=$('msg');e.className=t?c:'';e.textContent=t||''}

function api(action,extra){return new Promise((res,rej)=>{
  const cb='cb'+Date.now()+Math.floor(Math.random()*1e4),s=document.createElement('script');
  const tm=setTimeout(()=>{delete window[cb];s.remove();rej(new Error('اتصال برقرار نشد. دوباره تلاش کنید.'))},20000);
  const p=new URLSearchParams({action:action,initData:TG?TG.initData:'',callback:cb});
  Object.entries(extra||{}).forEach(([k,v])=>p.set(k,typeof v==='object'?JSON.stringify(v):v));
  window[cb]=d=>{clearTimeout(tm);delete window[cb];s.remove();res(d)};
  s.onerror=()=>{clearTimeout(tm);delete window[cb];s.remove();rej(new Error('Web App در دسترس نیست.'))};
  s.src=API_URL+'?'+p;document.body.appendChild(s)})}
async function call(a,x){const r=await api(a,x);if(!r||!r.success)throw new Error((r&&r.error)||'خطا');return r}

async function boot(){
  try{
    if(!TG||!TG.initData){msg('این سامانه باید از داخل تلگرام باز شود.','er');return}
    msg('در حال اتصال...','ok');S=await call('get_app_state');msg('');render();
  }catch(e){msg(e.message,'er')}
}
function render(){
  ['pending','dash','screen'].forEach(i=>$(i).classList.add('hidden'));
  const u=S.user;
  if(u.status!=='فعال'){
    $('ptxt').textContent=u.status==='رد شده'?'درخواست عضویت شما رد شده است.':'درخواست عضویت شما ثبت شد. پس از تأیید مدیر سیستم، دوباره پنل را باز کنید.';
    $('pending').classList.remove('hidden');return;
  }
  $('uname').textContent='👤 '+(u.name||u.username)+' — '+u.role_1;
  $('mods').innerHTML='<button class="mod" onclick="open_(\'inbox\')"><div style="font-size:26px">⏳</div><b>کارتابل من</b><small>درخواست‌های منتظر تأیید شما</small></button>'+
    (S.modules||[]).map(m=>`<button class="mod" onclick="open_('${esc(m.slug)}')"><div style="font-size:26px">${esc(m.icon)}</div><b>${esc(m.name)}</b><small>${esc(m.description)}</small></button>`).join('');
  $('dash').classList.remove('hidden');
}
function scr(html){const s=$('screen');s.innerHTML=html+'<button class="s" onclick="back()">بازگشت</button>';s.classList.remove('hidden');s.scrollIntoView()}
function back(){$('screen').classList.add('hidden')}
const PO=()=>(S.projects||[]).map(p=>`<option value="${esc(p.project_id)}">${esc(p.name)}</option>`).join('');

const FORMS={
  material_request:{t:'📦 درخواست متریال',a:'create_request',f:[['project','پروژه','project'],['material','نام متریال'],['quantity','مقدار'],['unit','واحد (تن، عدد، ...)'],['description','توضیحات','area']]},
  progress_statement:{t:'📄 ارسال صورت وضعیت',a:'submit_workflow_item',x:{workflow_id:'WF-PROGRESS'},f:[['project_id','پروژه','project'],['title','عنوان / شماره صورت وضعیت'],['description','توضیحات','area']]},
  problems:{t:'⚠️ ثبت مشکلات و موانع',a:'create_problem',f:[['project_id','پروژه','project'],['title','عنوان'],['description','شرح','area'],['start_date','تاریخ شروع','date'],['delay_days','تأخیر (روز)','number']]},
  site_visits:{t:'📝 ثبت بازدید',a:'create_visit',f:[['project_id','پروژه','project'],['visit_date','تاریخ','date'],['progress','درصد پیشرفت','number'],['summary','خلاصه بازدید','area'],['problems','مشکلات','area']]}
};
function open_(k){
  if(FORMS[k])return form(k);
  const m={inbox:inbox,delay_results:delay_results,project_performance:project_performance,project_downloads:project_downloads,role_management:role_management,workflow_management:workflow_management};
  (m[k]||(()=>scr('<p>این بخش هنوز آماده نیست.</p>')))();
}
function form(k){
  const F=FORMS[k];
  scr(`<h3>${F.t}</h3>`+F.f.map(([id,l,t])=>`<label>${l}</label>`+(t==='project'?`<select id="f_${id}"><option value="">انتخاب کنید</option>${PO()}</select>`:t==='area'?`<textarea id="f_${id}"></textarea>`:`<input id="f_${id}" type="${t||'text'}">`)).join('')+
    `<button class="p" onclick="send_('${k}')">ثبت</button>`+(k==='problems'?'<div id="plist" style="margin-top:12px"></div>':''));
  if(k==='problems')call('get_problems').then(r=>{$('plist').innerHTML=(r.problems||[]).map(p=>`<div class="li"><b>${esc(p.title)}</b><div class="muted">${esc(p.status)} | تأخیر: ${esc(p.delay_days||0)} روز</div></div>`).join('')||'موردی ثبت نشده.'}).catch(()=>{});
}
async function send_(k){
  const F=FORMS[k],d=Object.assign({},F.x);F.f.forEach(([id])=>d[id]=$('f_'+id).value);
  try{await call(F.a,d);msg('✅ ثبت شد.','ok');k==='problems'?form(k):back()}catch(e){msg(e.message,'er')}
}

async function inbox(){
  scr('<h3>⏳ کارتابل من</h3><div id="ib">در حال دریافت...</div>');
  try{const r=await call('get_inbox');
    $('ib').innerHTML=(r.items||[]).map(i=>`<div class="li"><b>مرحله: ${esc(i.step)}</b><pre>${esc(i.text)}</pre><button class="p" onclick="act_('${esc(i.item_id)}','ok')">✅ ${esc(i.label)}</button>${i.can_reject?`<button class="r" onclick="act_('${esc(i.item_id)}','no')">❌ رد</button>`:''}</div>`).join('')||'کارتابل شما خالی است ✅';
  }catch(e){$('ib').innerHTML='<div class="er">'+esc(e.message)+'</div>'}
}
async function act_(id,k){try{await call('act_item',{item_id:id,kind:k});msg('✅ ثبت شد.','ok');inbox()}catch(e){msg(e.message,'er')}}

async function listScr(t,a,key,fn){
  scr(`<h3>${t}</h3><div id="ls">در حال دریافت...</div>`);
  try{const r=await call(a);$('ls').innerHTML=(r[key]||[]).map(fn).join('')||'موردی ثبت نشده.'}catch(e){$('ls').innerHTML='<div class="er">'+esc(e.message)+'</div>'}
}
const delay_results=()=>listScr('⏱ نتیجه تأخیرات','get_delay_results','delays',p=>`<div class="li"><b>${esc(p.title)}</b><div>تأخیر: ${esc(p.delay_days)} روز</div></div>`);
const project_performance=()=>listScr('📊 راندمان عملکرد','get_performance','performance',p=>`<div class="li"><b>${esc(p.project_id)}</b><div class="muted">پیشرفت: ${esc(p.progress)} | SPI: ${esc(p.spi)} | CPI: ${esc(p.cpi)} | بهره‌وری: ${esc(p.productivity)}</div></div>`);
const project_downloads=()=>scr('<h3>📁 پروژه‌ها</h3>'+(S.projects||[]).map(p=>`<div class="li"><b>${esc(p.name)}</b> <span class="muted">${esc(p.code||'')}</span></div>`).join(''));

async function role_management(){
  scr('<h3>👥 کاربران و عنوان‌های شغلی</h3><div class="muted">تأیید کاربر جدید و انتخاب عنوان در ربات انجام می‌شود.</div><div id="ls">در حال دریافت...</div><label>افزودن عنوان شغلی جدید</label><input id="nr" placeholder="مثلاً سرپرست کارگاه"><button class="p" onclick="addRole()">افزودن</button>');
  try{const r=await call('admin_list_users');$('ls').innerHTML=r.users.map(u=>`<div class="li"><b>${esc(u.name)}</b> <span class="muted">${esc(u.username?'@'+u.username:'')}</span><div class="muted">${esc(u.role_1)} — ${esc(u.status)}</div></div>`).join('')}catch(e){$('ls').innerHTML='<div class="er">'+esc(e.message)+'</div>'}
}
async function addRole(){try{await call('admin_add_role',{name:$('nr').value});msg('✅ اضافه شد.','ok');role_management()}catch(e){msg(e.message,'er')}}

async function workflow_management(){
  scr('<h3>🔄 مدیریت گردش کار</h3><div id="ls">در حال دریافت...</div>');
  try{const r=await call('admin_get_workflow_config');
    $('ls').innerHTML=r.workflows.map(w=>`<div class="card"><b>${esc(w.name)}</b>${w.steps.map(s=>`<div class="li"><b>مرحله ${s.stepNo}: ${esc(s.title)}</b>${r.users.map(u=>`<label style="font-weight:400;display:block;margin:6px 0"><input type="checkbox" style="width:auto;margin-left:6px" value="${esc(u.telegram_id)}" data-w="${esc(w.workflow_id)}" data-s="${s.stepNo}" ${(s.assigned_user_ids||[]).includes(String(u.telegram_id))?'checked':''}>${esc(u.name)} — ${esc(u.role_1)}</label>`).join('')}<button class="p" onclick="saveWf('${esc(w.workflow_id)}',${s.stepNo})">ذخیره مسئولان</button></div>`).join('')}</div>`).join('')||'گردشی تعریف نشده.';
  }catch(e){$('ls').innerHTML='<div class="er">'+esc(e.message)+'</div>'}
}
async function saveWf(w,s){
  try{const ids=[...document.querySelectorAll(`input[data-w="${w}"][data-s="${s}"]`)].filter(x=>x.checked).map(x=>x.value);
    await call('admin_set_workflow_assignments',{workflow_id:w,step_no:s,telegram_ids:ids});msg('✅ ذخیره شد.','ok')}catch(e){msg(e.message,'er')}
}
boot();
</script>
</body>
</html>
