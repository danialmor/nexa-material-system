<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>درخواست مصالح | NEXA</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root{
      --cream:#f6efe1;
      --cream2:#fffaf1;
      --gold:#b78a3c;
      --gold2:#d3ae68;
      --ink:#332d24;
      --muted:#7d7365;
      --line:#e5d7bc;
      --white:#fffdf8;
      --green:#56735a;
      --red:#9e5148;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;background:linear-gradient(160deg,#fffaf1 0%,var(--cream) 62%,#eadfc8 100%);color:var(--ink)}
    body{padding:16px}
    .app{max-width:520px;margin:auto}
    .hero{text-align:center;padding:10px 8px 18px}
    .mark{width:64px;height:64px;margin:0 auto 14px;border-radius:20px;display:grid;place-items:center;background:linear-gradient(145deg,var(--gold2),var(--gold));color:#fff;font-size:30px;box-shadow:0 10px 24px rgba(110,80,25,.2)}
    h1{font-size:24px;margin:0;font-weight:800}
    .subtitle{margin:7px 0 0;color:var(--muted);font-size:13px}
    .card{background:rgba(255,253,248,.9);border:1px solid rgba(183,138,60,.18);border-radius:24px;padding:18px;box-shadow:0 14px 35px rgba(76,58,29,.1);backdrop-filter:blur(10px)}
    .user{display:flex;align-items:center;gap:12px;padding:13px;background:var(--cream2);border:1px solid var(--line);border-radius:16px;margin-bottom:18px}
    .avatar{width:44px;height:44px;border-radius:50%;background:var(--gold);color:#fff;display:grid;place-items:center;font-weight:800;font-size:17px}
    .name{font-weight:800;font-size:15px}.role{font-size:12px;color:var(--muted);margin-top:3px}
    .section-title{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px;margin-bottom:14px}
    .icon{width:30px;height:30px;border-radius:9px;background:#f0e4ca;display:grid;place-items:center;color:#8c682f}
    .field{margin:0 0 13px}
    label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
    input,textarea{width:100%;border:1px solid var(--line);border-radius:13px;background:#fffdf8;color:var(--ink);padding:13px 14px;font-size:14px;outline:none}
    input:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(183,138,60,.11)}
    textarea{min-height:95px;resize:vertical}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .btn{width:100%;border:0;border-radius:14px;padding:14px;margin-top:6px;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#fff;font-size:15px;font-weight:800;box-shadow:0 8px 18px rgba(110,80,25,.18);cursor:pointer}
    .btn:active{transform:scale(.99)}.btn:disabled{opacity:.55;cursor:not-allowed}
    .status{display:none;margin-top:13px;border-radius:12px;padding:11px 12px;font-size:13px;line-height:1.7}
    .status.show{display:block}.success{background:#edf3ed;color:var(--green)}.error{background:#f7ece9;color:var(--red)}.info{background:#f2ede3;color:#655b4e}
    .hidden{display:none!important}
    .success-box{text-align:center;padding:8px 0 4px}
    .success-icon{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:#edf3ed;color:var(--green);font-size:30px;margin:4px auto 14px}
    .code{margin-top:12px;padding:11px;background:var(--cream);border-radius:10px;color:#8b682f;font-weight:800;font-size:13px}
    .footer{text-align:center;color:var(--muted);font-size:11px;padding:16px 0 4px}
    .debug{margin-top:12px;padding:10px;border-radius:10px;background:#191919;color:#eee;font:11px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace;direction:ltr;text-align:left;word-break:break-all;display:none}
    @media(max-width:420px){body{padding:12px}.row{grid-template-columns:1fr}.card{padding:15px}.hero{padding-top:6px}}
  </style>
</head>
<body>
<div class="app">
  <div class="hero">
    <div class="mark">📦</div>
    <h1>درخواست مصالح</h1>
    <p class="subtitle">سامانه ثبت و پیگیری درخواست‌های خرید</p>
  </div>

  <div class="card">
    <div class="user">
      <div id="avatar" class="avatar">👤</div>
      <div>
        <div id="userName" class="name">در حال شناسایی...</div>
        <div id="userRole" class="role">در حال اتصال به Telegram</div>
      </div>
    </div>

    <div id="registerSection" class="hidden">
      <div class="section-title"><div class="icon">👤</div>معرفی کاربر</div>
      <div class="field">
        <label for="role">سمت / نقش شما</label>
        <input id="role" type="text" placeholder="مثلاً سرپرست کارگاه">
      </div>
      <button id="registerBtn" class="btn" type="button">ادامه</button>
      <div id="registerStatus" class="status"></div>
    </div>

    <div id="requestSection" class="hidden">
      <div class="section-title"><div class="icon">📋</div>ثبت درخواست جدید</div>

      <div class="field">
        <label for="material">نام مصالح</label>
        <input id="material" type="text" placeholder="مثلاً سیمان، میلگرد، گچ...">
      </div>

      <div class="row">
        <div class="field">
          <label for="quantity">مقدار</label>
          <input id="quantity" type="number" inputmode="decimal" placeholder="مثلاً 100">
        </div>
        <div class="field">
          <label for="unit">واحد</label>
          <input id="unit" type="text" placeholder="کیسه / تن / عدد">
        </div>
      </div>

      <div class="field">
        <label for="description">توضیحات</label>
        <textarea id="description" placeholder="توضیحات تکمیلی درخواست..."></textarea>
      </div>

      <button id="submitBtn" class="btn" type="button">ثبت درخواست</button>
      <div id="requestStatus" class="status"></div>
    </div>

    <div id="successSection" class="success-box hidden">
      <div class="success-icon">✓</div>
      <h2>درخواست ثبت شد</h2>
      <p style="margin:8px 0 0;color:var(--muted);font-size:13px">درخواست برای بررسی مدیر اجرایی ارسال می‌شود.</p>
      <div id="requestCode" class="code">کد درخواست: —</div>
      <button id="newBtn" class="btn" type="button">ثبت درخواست جدید</button>
    </div>

    <div id="appStatus" class="status"></div>
    <div id="debug" class="debug"></div>
  </div>

  <div class="footer">NEXA • Material Request System</div>
</div>

<script>
  const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;

  // مرحله اتصال Backend در گام بعدی این URL را استفاده خواهد کرد.
  const API_URL = "";

  let telegramUser = null;

  function showStatus(id, message, type="info"){
    const el=document.getElementById(id);
    el.textContent=message;
    el.className="status show "+type;
  }

  function showDebug(message){
    const el=document.getElementById("debug");
    el.textContent=message;
    el.style.display="block";
  }

  function initTelegram(){
    if(!tg){
      document.getElementById("userName").textContent="Telegram WebApp شناسایی نشد";
      document.getElementById("userRole").textContent="این صفحه باید از داخل Telegram Mini App باز شود.";
      showStatus("appStatus","محیط Telegram پیدا نشد. لینک را از داخل Telegram اجرا کنید.","error");
      showDebug("window.Telegram = undefined\nURL = "+location.href);
      return;
    }

    tg.ready();
    tg.expand();

    telegramUser = tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user : null;

    if(!telegramUser){
      document.getElementById("userName").textContent="کاربر Telegram شناسایی نشد";
      document.getElementById("userRole").textContent="initData کاربر دریافت نشد.";
      showStatus("appStatus","Mini App باز شده ولی اطلاعات کاربر از Telegram دریافت نشد.","error");
      showDebug(
        "Telegram WebApp: YES\n"+
        "Platform: "+(tg.platform||"-")+"\n"+
        "Version: "+(tg.version||"-")+"\n"+
        "initData length: "+((tg.initData||"").length)+"\n"+
        "URL = "+location.href
      );
      return;
    }

    const fullName=[telegramUser.first_name||"",telegramUser.last_name||""].join(" ").trim() || "کاربر";
    document.getElementById("userName").textContent=fullName;
    document.getElementById("avatar").textContent=(telegramUser.first_name||"👤").charAt(0);
    document.getElementById("userRole").textContent="Telegram ID: "+telegramUser.id;

    document.getElementById("registerSection").classList.remove("hidden");
    showStatus("appStatus","اتصال Telegram با موفقیت انجام شد. مرحله بعد اتصال به Google Sheets است.","success");

    document.getElementById("registerBtn").addEventListener("click", ()=>{
      const role=document.getElementById("role").value.trim();
      if(!role){
        showStatus("registerStatus","لطفاً سمت خود را وارد کنید.","error");
        return;
      }
      // Backend connection will be enabled next.
      showStatus("registerStatus","کاربر شناسایی شد. در گام بعد ثبت این اطلاعات در Google Sheets فعال می‌شود.","success");
      document.getElementById("registerSection").classList.add("hidden");
      document.getElementById("requestSection").classList.remove("hidden");
      document.getElementById("userRole").textContent="سمت: "+role;
    });

    document.getElementById("submitBtn").addEventListener("click", ()=>{
      const material=document.getElementById("material").value.trim();
      const quantity=document.getElementById("quantity").value.trim();
      const unit=document.getElementById("unit").value.trim();
      const description=document.getElementById("description").value.trim();

      if(!material){
        showStatus("requestStatus","نام مصالح را وارد کنید.","error");
        return;
      }

      showStatus("requestStatus","فرم آماده است؛ اتصال ثبت درخواست به Google Sheets در مرحله بعد فعال می‌شود.","info");
      document.getElementById("submitBtn").disabled=true;
    });

    document.getElementById("newBtn").addEventListener("click", ()=>{
      document.getElementById("successSection").classList.add("hidden");
      document.getElementById("requestSection").classList.remove("hidden");
    });
  }

  window.addEventListener("load", ()=>{
    setTimeout(initTelegram,300);
  });
</script>
</body>
</html>
